<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Accommodation & Roommate Ecosystem</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: { 50: '#f0fdfa', 100: '#ccfbf1', 500: '#14b8a6', 600: '#0d9488', 700: '#0f766e' }
                    }
                }
            }
        }
    </script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; background-color: #f9fafb; }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade-in { animation: fadeIn 0.4s ease-out forwards; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const propertiesData = [
            { id: "1", title: "Sunshine PG for Boys", category: "PG - 2 BHK", roomType: "Sharing", price: 6500, accessories: { ac: true }, washroom: "Attached", meals: "3 times", locality: "Koramangala", lateNightAllowance: true, rating: 4.5, imageUrl: "https://images.unsplash.com/photo-1522708323590-d24dbb6b0267?ixlib=rb-4.0.3&auto=format&fit=crop&w=800&q=80" },
            { id: "2", title: "Elite Girls Hostel", category: "Hostel", roomType: "Non-Sharing", price: 12000, accessories: { ac: true }, washroom: "Attached", meals: "4 times", locality: "Indiranagar", lateNightAllowance: false, rating: 4.8, imageUrl: "https://images.unsplash.com/photo-1555854877-bab0e564b8d5?ixlib=rb-4.0.3&auto=format&fit=crop&w=800&q=80" },
            { id: "3", title: "Budget Co-living Space", category: "Sharing - 3 capacity", roomType: "Sharing", price: 4500, accessories: { ac: false }, washroom: "Common", meals: "3 times", locality: "HSR Layout", lateNightAllowance: true, rating: 3.9, imageUrl: "https://images.unsplash.com/photo-1513694203232-719a280e022f?ixlib=rb-4.0.3&auto=format&fit=crop&w=800&q=80" },
            { id: "4", title: "Premium 1 BHK PG", category: "PG - 1 BHK", roomType: "Non-Sharing", price: 15000, accessories: { ac: true }, washroom: "Attached", meals: "5 times", locality: "Whitefield", lateNightAllowance: true, rating: 4.9, imageUrl: "https://images.unsplash.com/photo-1502672260266-1c1e52409818?ixlib=rb-4.0.3&auto=format&fit=crop&w=800&q=80" },
            { id: "5", title: "Student Nest - 4 Sharing", category: "Sharing - 4 capacity", roomType: "Sharing", price: 3500, accessories: { ac: false }, washroom: "Common", meals: "3 times", locality: "Koramangala", lateNightAllowance: false, rating: 3.5, imageUrl: "https://images.unsplash.com/photo-1554995207-c18c203602cb?ixlib=rb-4.0.3&auto=format&fit=crop&w=800&q=80" },
            { id: "6", title: "Comfort Zone PG", category: "PG - 2 BHK", roomType: "Sharing", price: 8000, accessories: { ac: true }, washroom: "Attached", meals: "3 times", locality: "Jayanagar", lateNightAllowance: false, rating: 4.2, imageUrl: "https://images.unsplash.com/photo-1522771731478-44fb896bf54f?ixlib=rb-4.0.3&auto=format&fit=crop&w=800&q=80" }
        ];

        const Icon = ({ name, size = 16, className = "" }) => {
            const iconRef = React.useRef(null);
            useEffect(() => {
                if (iconRef.current && window.lucide && window.lucide.icons[name]) {
                    const iconData = window.lucide.icons[name];
                    iconRef.current.innerHTML = "";
                    window.lucide.createIcons({ icons: { [name]: iconData }, nameAttr: 'data-lucide', attrs: { class: className, width: size, height: size }});
                }
            }, [name, size, className]);
            return <i data-lucide={name} className={className} style={{ width: size, height: size, display: 'inline-block' }}></i>;
        };

        const RoommateForm = () => {
            const [formData, setFormData] = useState({ name: '', idProofType: 'Aadhar', hygiene: 5, cleanliness: 5, lifestyle: 'balanced', understanding: 5 });
            const [isSubmitting, setIsSubmitting] = useState(false);
            const [result, setResult] = useState(null);

            const handleInputChange = (e) => setFormData(prev => ({ ...prev, [e.target.name]: e.target.value }));

            const getAICompatibility = async (userQualities) => {
                return new Promise((resolve) => {
                    setTimeout(() => {
                        const score = Math.floor(Math.random() * 30) + 70; // 70-99%
                        let reason = "You both share an excellent mutual understanding and maintain high standards of cleanliness.";
                        if (userQualities.lifestyle === 'night') reason = "You both are night owls and prefer clean spaces, making late-night study sessions perfectly in sync!";
                        else if (userQualities.lifestyle === 'early') reason = "As early birds, you'll both enjoy quiet mornings and a structured, hygienic living environment.";
                        resolve({ compatibilityPercentage: score, aiReason: reason });
                    }, 2000);
                });
            };

            const handleSubmit = async (e) => {
                e.preventDefault();
                setIsSubmitting(true);
                setResult(null);
                try {
                    const aiResponse = await getAICompatibility(formData);
                    setResult(aiResponse);
                } catch (error) { console.error(error); } 
                finally { setIsSubmitting(false); }
            };

            return (
                <div className="max-w-5xl mx-auto flex flex-col md:flex-row gap-8 items-start animate-fade-in">
                    <div className="bg-white rounded-2xl shadow-sm border border-gray-100 p-8 flex-1 w-full">
                        <div className="mb-8">
                            <h2 className="text-2xl font-bold text-gray-900 flex items-center gap-2"><Icon name="Sparkles" className="text-indigo-500" size={24} /> Find Your Ideal Roommate</h2>
                            <p className="text-gray-500 text-sm mt-2">Let our AI match you with the perfect living partner based on your lifestyle.</p>
                        </div>
                        <form onSubmit={handleSubmit} className="space-y-6">
                            <div className="space-y-4">
                                <h3 className="text-lg font-semibold text-gray-800 border-b pb-2">Basic Details</h3>
                                <div>
                                    <label className="block text-sm font-medium text-gray-700 mb-1">Full Name</label>
                                    <div className="relative">
                                        <div className="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none"><Icon name="User" size={18} className="text-gray-400" /></div>
                                        <input type="text" name="name" required placeholder="Enter your name" className="w-full pl-10 pr-3 py-2.5 bg-gray-50 border border-gray-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500" value={formData.name} onChange={handleInputChange} />
                                    </div>
                                </div>
                                <div className="flex gap-4">
                                    <div className="flex-1">
                                        <label className="block text-sm font-medium text-gray-700 mb-1">ID Proof Type</label>
                                        <div className="relative">
                                            <div className="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none"><Icon name="FileText" size={18} className="text-gray-400" /></div>
                                            <select name="idProofType" className="w-full pl-10 pr-3 py-2.5 bg-gray-50 border border-gray-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 appearance-none" value={formData.idProofType} onChange={handleInputChange}>
                                                <option value="Aadhar">Aadhar Card</option><option value="PAN Card">PAN Card</option><option value="Voter ID">Voter ID</option>
                                            </select>
                                        </div>
                                    </div>
                                    <div className="flex-1">
                                        <label className="block text-sm font-medium text-gray-700 mb-1">Upload ID</label>
                                        <button type="button" className="w-full flex items-center justify-center gap-2 py-2.5 bg-gray-50 border border-gray-200 border-dashed rounded-xl text-sm font-medium text-gray-600 hover:bg-gray-100 hover:text-indigo-600 transition-colors"><Icon name="Upload" size={18} /> Choose File</button>
                                    </div>
                                </div>
                            </div>
                            <div className="space-y-6 pt-4">
                                <h3 className="text-lg font-semibold text-gray-800 border-b pb-2">Your Lifestyle & Habits</h3>
                                <div className="space-y-4">
                                    {['hygiene', 'cleanliness', 'understanding'].map(attr => (
                                        <div key={attr}>
                                            <div className="flex justify-between items-center mb-1">
                                                <label className="text-sm font-medium text-gray-700 capitalize">{attr === 'understanding' ? 'Mutual Understanding Flexibility' : attr}</label>
                                                <span className="text-xs font-bold text-indigo-600 bg-indigo-50 px-2 py-0.5 rounded">{formData[attr]}/10</span>
                                            </div>
                                            <input type="range" name={attr} min="1" max="10" className="w-full h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer accent-indigo-600" value={formData[attr]} onChange={handleInputChange} />
                                        </div>
                                    ))}
                                    <div className="pt-2">
                                        <label className="block text-sm font-medium text-gray-700 mb-3">Lifestyle Routine</label>
                                        <div className="grid grid-cols-3 gap-3">
                                            {['early', 'balanced', 'night'].map((type) => (
                                                <label key={type} className={`cursor-pointer text-center py-2 px-3 border rounded-xl text-sm font-medium transition-all ${formData.lifestyle === type ? 'bg-indigo-50 border-indigo-200 text-indigo-700' : 'bg-white border-gray-200 text-gray-600 hover:bg-gray-50'}`}>
                                                    <input type="radio" name="lifestyle" value={type} className="hidden" checked={formData.lifestyle === type} onChange={handleInputChange} />
                                                    {type === 'early' ? 'Early Bird' : type === 'night' ? 'Night Owl' : 'Flexible'}
                                                </label>
                                            ))}
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <button type="submit" disabled={isSubmitting || !formData.name} className="w-full mt-6 bg-gradient-to-r from-indigo-600 to-primary-600 hover:from-indigo-700 hover:to-primary-700 text-white font-bold py-3.5 rounded-xl shadow-md transition-all flex justify-center items-center gap-2 disabled:opacity-70 disabled:cursor-not-allowed">
                                {isSubmitting ? <><Icon name="Loader2" className="animate-spin" size={20} /> Finding Best Match...</> : <><Icon name="Sparkles" size={20} /> Generate AI Match</>}
                            </button>
                        </form>
                    </div>

                    <div className="w-full md:w-80 flex-shrink-0">
                        {result ? (
                            <div className="bg-white rounded-2xl shadow-sm border border-indigo-100 p-6 flex flex-col items-center text-center animate-fade-in relative overflow-hidden">
                                <div className="absolute top-0 inset-x-0 h-1 bg-gradient-to-r from-indigo-500 to-primary-500"></div>
                                <h3 className="text-lg font-bold text-gray-900 mb-6">AI Match Results</h3>
                                <div className="relative w-36 h-36 mb-6">
                                    <svg className="w-full h-full transform -rotate-90" viewBox="0 0 36 36">
                                        <path className="text-gray-100" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" fill="none" strokeWidth="3" />
                                        <path className="text-indigo-500" strokeDasharray={`${result.compatibilityPercentage}, 100`} d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" fill="none" stroke="currentColor" strokeWidth="3" strokeLinecap="round" style={{ transition: 'stroke-dasharray 1s ease-out' }} />
                                    </svg>
                                    <div className="absolute inset-0 flex flex-col items-center justify-center">
                                        <span className="text-3xl font-extrabold text-gray-900">{result.compatibilityPercentage}%</span>
                                        <span className="text-[10px] uppercase font-bold text-indigo-500 tracking-wider">Match</span>
                                    </div>
                                </div>
                                <div className="bg-indigo-50 rounded-xl p-4 w-full">
                                    <p className="text-sm text-indigo-900 font-medium leading-relaxed italic">"{result.aiReason}"</p>
                                </div>
                                <button className="w-full mt-6 bg-white border-2 border-indigo-100 text-indigo-600 hover:bg-indigo-50 font-bold py-2.5 rounded-xl transition-colors flex items-center justify-center gap-2">
                                    <Icon name="CheckCircle2" size={18} /> Connect Profile
                                </button>
                            </div>
                        ) : (
                            <div className="bg-gray-50 rounded-2xl border border-gray-200 border-dashed p-8 flex flex-col items-center justify-center text-center h-full min-h-[400px]">
                                <Icon name="Sparkles" size={48} className="text-gray-300 mb-4" />
                                <h3 className="text-lg font-bold text-gray-600 mb-2">No Match Generated</h3>
                                <p className="text-gray-400 text-sm">Fill out the form and let our AI find the perfect roommate based on your lifestyle habits.</p>
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        const FilterSidebar = ({ filters, onChange, onClear }) => {
            const [isOpen, setIsOpen] = useState(false);
            const handleCategoryToggle = (cat) => onChange({ ...filters, categories: filters.categories.includes(cat) ? filters.categories.filter((c) => c !== cat) : [...filters.categories, cat] });
            const handleMealsToggle = (meal) => onChange({ ...filters, meals: filters.meals.includes(meal) ? filters.meals.filter((m) => m !== meal) : [...filters.meals, meal] });

            return (
                <React.Fragment>
                    <button className="md:hidden w-full mb-4 flex items-center justify-center gap-2 bg-white border border-gray-200 text-gray-700 py-2 rounded-lg shadow-sm font-medium" onClick={() => setIsOpen(!isOpen)}><Icon name="Filter" size={18} /> {isOpen ? 'Hide Filters' : 'Show Filters'}</button>
                    <div className={`bg-white rounded-2xl shadow-sm border border-gray-100 p-6 flex-col gap-6 ${isOpen ? 'flex' : 'hidden md:flex'}`}>
                        <div className="flex items-center justify-between pb-4 border-b border-gray-100"><h2 className="text-lg font-bold text-gray-800 flex items-center gap-2"><Icon name="Filter" size={20} className="text-primary-600" /> Filters</h2><button onClick={onClear} className="text-sm text-gray-500 hover:text-primary-600 font-medium transition-colors">Clear All</button></div>
                        <div className="space-y-3"><label className="text-sm font-semibold text-gray-700">Locality</label><div className="relative"><div className="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none"><Icon name="Search" size={16} className="text-gray-400" /></div><input type="text" placeholder="Search locality..." className="w-full pl-10 pr-3 py-2 bg-gray-50 border border-gray-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-primary-500 focus:bg-white transition-all" value={filters.locality} onChange={(e) => onChange({ ...filters, locality: e.target.value })} /></div></div>
                        <div className="space-y-3"><label className="text-sm font-semibold text-gray-700">Property Category</label><div className="space-y-2">{['PG - 1 BHK', 'PG - 2 BHK', 'Sharing - 2 capacity', 'Sharing - 3 capacity', 'Sharing - 4 capacity', 'Hostel'].map((cat) => (<label key={cat} className="flex items-center gap-3 group cursor-pointer"><input type="checkbox" className="w-4 h-4 rounded border-gray-300 text-primary-600 focus:ring-primary-500 cursor-pointer" checked={filters.categories.includes(cat)} onChange={() => handleCategoryToggle(cat)} /><span className="text-sm text-gray-600 group-hover:text-gray-900">{cat}</span></label>))}</div></div>
                        <div className="space-y-3"><label className="text-sm font-semibold text-gray-700">Room Type</label><div className="flex gap-4">{['Sharing', 'Non-Sharing'].map((type) => (<label key={type} className="flex items-center gap-2 cursor-pointer"><input type="radio" name="roomType" className="w-4 h-4 text-primary-600 focus:ring-primary-500 border-gray-300 cursor-pointer" checked={filters.roomType === type} onChange={() => onChange({ ...filters, roomType: type })} /><span className="text-sm text-gray-600">{type}</span></label>))}</div></div>
                        <div className="space-y-4"><div className="flex justify-between items-center"><label className="text-sm font-semibold text-gray-700">Max Budget</label><span className="text-xs font-bold text-primary-600 bg-primary-50 px-2 py-1 rounded-md">₹{filters.budget}</span></div><input type="range" min="2000" max="30000" step="500" className="w-full h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer accent-primary-600" value={filters.budget} onChange={(e) => onChange({ ...filters, budget: Number(e.target.value) })} /></div>
                        <div className="space-y-3"><label className="text-sm font-semibold text-gray-700">Accessories</label><div className="flex gap-3"><button className={`flex-1 py-2 text-sm font-medium rounded-lg border transition-all ${filters.accessories.ac ? 'bg-primary-50 border-primary-200 text-primary-700' : 'bg-white border-gray-200 text-gray-600'}`} onClick={() => onChange({ ...filters, accessories: { ...filters.accessories, ac: !filters.accessories.ac } })}>AC</button><button className={`flex-1 py-2 text-sm font-medium rounded-lg border transition-all ${filters.accessories.nonAc ? 'bg-primary-50 border-primary-200 text-primary-700' : 'bg-white border-gray-200 text-gray-600'}`} onClick={() => onChange({ ...filters, accessories: { ...filters.accessories, nonAc: !filters.accessories.nonAc } })}>Non-AC</button></div></div>
                        <div className="space-y-3"><label className="text-sm font-semibold text-gray-700">Washroom</label><div className="flex gap-4">{['Attached', 'Common'].map((type) => (<label key={type} className="flex items-center gap-2 cursor-pointer"><input type="radio" name="washroom" className="w-4 h-4 text-primary-600 focus:ring-primary-500 cursor-pointer" checked={filters.washroom === type} onChange={() => onChange({ ...filters, washroom: type })} /><span className="text-sm text-gray-600">{type}</span></label>))}</div></div>
                        <div className="space-y-3"><label className="text-sm font-semibold text-gray-700">Meals</label><div className="space-y-2">{['3 times', '4 times', '5 times'].map((meal) => (<label key={meal} className="flex items-center gap-3 group cursor-pointer"><input type="checkbox" className="w-4 h-4 rounded border-gray-300 text-primary-600 cursor-pointer" checked={filters.meals.includes(meal)} onChange={() => handleMealsToggle(meal)} /><span className="text-sm text-gray-600 group-hover:text-gray-900">{meal} a day</span></label>))}</div></div>
                        <div className="space-y-3 pt-2 border-t border-gray-100"><label className="flex items-center justify-between cursor-pointer"><span className="text-sm font-semibold text-gray-700 flex items-center gap-2"><Icon name="Moon" size={16} className="text-indigo-500" /> Late Night Allowance</span><div className={`relative inline-flex h-6 w-11 items-center rounded-full transition-colors ${filters.lateNight ? 'bg-primary-500' : 'bg-gray-200'}`}><input type="checkbox" className="sr-only" checked={filters.lateNight} onChange={() => onChange({ ...filters, lateNight: !filters.lateNight })} /><span className={`inline-block h-4 w-4 transform rounded-full bg-white transition-transform ${filters.lateNight ? 'translate-x-6' : 'translate-x-1'}`} /></div></label></div>
                    </div>
                </React.Fragment>
            );
        };

        const PropertyCard = ({ property }) => (
            <div className="bg-white rounded-2xl overflow-hidden shadow-sm border border-gray-100 hover:shadow-lg hover:border-primary-100 transition-all duration-300 group animate-fade-in flex flex-col h-full">
                <div className="relative h-48 overflow-hidden">
                    <img src={property.imageUrl} alt={property.title} className="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500"/>
                    <div className="absolute top-3 left-3 bg-white/90 backdrop-blur-sm px-2.5 py-1 rounded-md text-xs font-bold text-gray-800 shadow-sm flex items-center gap-1"><Icon name="Star" className="text-yellow-500" size={12} /> {property.rating}</div>
                    <div className="absolute top-3 right-3 bg-primary-600 text-white px-3 py-1 rounded-full text-xs font-semibold shadow-sm">{property.category}</div>
                    {property.lateNightAllowance && <div className="absolute bottom-3 right-3 bg-indigo-600/90 backdrop-blur-sm text-white px-2 py-1 rounded text-[10px] font-bold uppercase tracking-wider shadow-sm">Late Entry</div>}
                </div>
                <div className="p-5 flex-1 flex flex-col">
                    <div className="flex justify-between items-start mb-2"><h3 className="text-lg font-bold text-gray-900 line-clamp-1">{property.title}</h3><div className="text-right"><span className="text-xl font-bold text-primary-600">₹{property.price}</span><span className="text-xs text-gray-500 block">/month</span></div></div>
                    <div className="flex items-center gap-1.5 text-gray-500 text-sm mb-4"><Icon name="MapPin" size={14} /><span className="truncate">{property.locality}</span></div>
                    <div className="grid grid-cols-2 gap-y-3 gap-x-2 text-sm text-gray-600 mb-6 mt-auto">
                        <div className="flex items-center gap-2"><div className="bg-gray-100 p-1.5 rounded text-gray-600"><Icon name="CheckCircle2" size={14} /></div><span className="truncate">{property.roomType}</span></div>
                        <div className="flex items-center gap-2"><div className="bg-gray-100 p-1.5 rounded text-gray-600"><Icon name="Wind" size={14} /></div><span className="truncate">{property.accessories.ac ? 'AC Room' : 'Non-AC'}</span></div>
                        <div className="flex items-center gap-2"><div className="bg-gray-100 p-1.5 rounded text-gray-600"><Icon name="Bath" size={14} /></div><span className="truncate">{property.washroom}</span></div>
                        <div className="flex items-center gap-2"><div className="bg-gray-100 p-1.5 rounded text-gray-600"><Icon name="Utensils" size={14} /></div><span className="truncate">{property.meals}</span></div>
                    </div>
                    <button className="w-full bg-primary-50 text-primary-700 hover:bg-primary-600 hover:text-white font-semibold py-2.5 rounded-xl transition-colors duration-200 mt-auto">View Details</button>
                </div>
            </div>
        );

        const EmptyState = () => (
            <div className="flex flex-col items-center justify-center py-20 px-4 text-center animate-fade-in bg-white rounded-2xl border border-gray-100 border-dashed h-full">
                <div className="w-24 h-24 bg-gray-50 rounded-full flex items-center justify-center mb-6"><Icon name="Search" className="text-gray-300" size={40} /></div>
                <h3 className="text-xl font-bold text-gray-900 mb-2">No properties found</h3>
                <p className="text-gray-500 max-w-sm mb-6">We couldn't find any accommodations matching your current filters. Try adjusting your preferences to see more results.</p>
            </div>
        );

        const PropertyGrid = ({ properties }) => {
            if (!properties || properties.length === 0) return <EmptyState />;
            return <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-2 xl:grid-cols-3 gap-6">{properties.map(p => <PropertyCard key={p.id} property={p} />)}</div>;
        };

        const App = () => {
            const [currentTab, setCurrentTab] = useState('discovery');
            const [filters, setFilters] = useState({ categories: [], roomType: '', budget: 20000, accessories: { ac: false, nonAc: false }, washroom: '', meals: [], locality: '', lateNight: false });

            const filteredProperties = propertiesData.filter((property) => {
                if (filters.categories.length > 0 && !filters.categories.includes(property.category)) return false;
                if (filters.roomType && property.roomType !== filters.roomType) return false;
                if (property.price > filters.budget) return false;
                if (filters.accessories.ac && !property.accessories.ac) return false;
                if (filters.accessories.nonAc && property.accessories.ac) return false;
                if (filters.washroom && property.washroom !== filters.washroom) return false;
                if (filters.meals.length > 0 && !filters.meals.includes(property.meals)) return false;
                if (filters.locality && !property.locality.toLowerCase().includes(filters.locality.toLowerCase())) return false;
                if (filters.lateNight && !property.lateNightAllowance) return false;
                return true;
            });

            return (
                <div className="min-h-screen bg-gray-50 font-sans flex flex-col">
                    <nav className="bg-white border-b border-gray-200 sticky top-0 z-50 shadow-sm">
                        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
                            <div className="flex items-center gap-2 text-primary-600 font-bold text-xl tracking-tight">
                                <Icon name="Building2" size={24} /> StayMate
                            </div>
                            <div className="flex gap-6 text-sm font-medium text-gray-500">
                                <button 
                                    className={`py-5 border-b-2 transition-colors ${currentTab === 'discovery' ? 'text-primary-600 border-primary-600' : 'border-transparent hover:text-gray-900'}`}
                                    onClick={() => setCurrentTab('discovery')}
                                >Discovery</button>
                                <button 
                                    className={`py-5 border-b-2 transition-colors ${currentTab === 'ai-match' ? 'text-indigo-600 border-indigo-600' : 'border-transparent hover:text-gray-900'}`}
                                    onClick={() => setCurrentTab('ai-match')}
                                >AI Roommate Match</button>
                            </div>
                        </div>
                    </nav>

                    {currentTab === 'discovery' ? (
                        <div className="flex-1 max-w-7xl w-full mx-auto px-4 py-8 flex flex-col md:flex-row gap-8">
                            <aside className="w-full md:w-72 flex-shrink-0">
                                <FilterSidebar filters={filters} onChange={setFilters} onClear={() => setFilters({ categories: [], roomType: '', budget: 20000, accessories: { ac: false, nonAc: false }, washroom: '', meals: [], locality: '', lateNight: false })} />
                            </aside>
                            <main className="flex-1">
                                <div className="mb-6 flex justify-between items-end">
                                    <div>
                                        <h1 className="text-2xl font-bold text-gray-900">Find Your Perfect Stay</h1>
                                        <p className="text-gray-500 text-sm mt-1">Showing {filteredProperties.length} properties</p>
                                    </div>
                                </div>
                                <PropertyGrid properties={filteredProperties} />
                            </main>
                        </div>
                    ) : (
                        <div className="flex-1 max-w-7xl w-full mx-auto px-4 py-8">
                            <RoommateForm />
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
